<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700">
  <rect width="100%" height="100%" fill="#F7FAFF"/>
  <rect x="40" y="30" width="220" height="60" rx="10" fill="#1A73E8"/>
  <text x="60" y="70" fill="#fff" font-size="20" font-family="Nunito Sans">PodSquad</text>
  <text x="300" y="60" fill="#0B1220" font-size="18" font-family="Nunito Sans">Welcome back — pick your Studio or Record a new episode</text>

  <!-- Companion cards -->
  <g>
    <rect x="40" y="110" width="260" height="120" rx="14" fill="#fff" stroke="#eee"/>
    <text x="70" y="150" font-family="Nunito Sans" font-size="16" fill="#1A73E8">Zoie — Ages 5–8</text>
    <text x="70" y="175" font-family="Nunito Sans" font-size="12" fill="#666">Playful co-host for storytime</text>
  </g>
  <g>
    <rect x="320" y="110" width="260" height="120" rx="14" fill="#fff" stroke="#eee"/>
    <text x="350" y="150" font-family="Nunito Sans" font-size="16" fill="#FF6F61">Ari — Ages 9–12</text>
    <text x="350" y="175" font-family="Nunito Sans" font-size="12" fill="#666">Creative collaborator</text>
  </g>
  <g>
    <rect x="600" y="110" width="260" height="120" rx="14" fill="#fff" stroke="#eee"/>
    <text x="630" y="150" font-family="Nunito Sans" font-size="16" fill="#0B1220">Soni — Ages 13–17</text>
    <text x="630" y="175" font-family="Nunito Sans" font-size="12" fill="#666">Pro-level co-host</text>
  </g>

  <!-- Main actions and episodes carousel -->
  <rect x="40" y="260" width="920" height="320" rx="14" fill="#fff" stroke="#eee"/>
  <text x="60" y="300" font-family="Nunito Sans" font-size="18" fill="#0B1220">Studio Home</text>
  <rect x="60" y="330" width="260" height="40" rx="8" fill="#1A73E8"/>
  <text x="98" y="357" fill="#fff" font-family="Nunito Sans">Record New Episode</text>
  <text x="350" y="360" font-family="Nunito Sans" font-size="14" fill="#666">My Episodes</text>
  <!-- sample episode tiles -->
  <g>
    <rect x="340" y="380" width="180" height="80" rx="10" fill="#FDF6F5" stroke="#FFEAE8"/>
    <rect x="540" y="380" width="180" height="80" rx="10" fill="#FFF9EC" stroke="#FFF0C2"/>
    <rect x="740" y="380" width="180" height="80" rx="10" fill="#F0F7FF" stroke="#DCEEFF"/>
  </g>

  <text x="60" y="620" font-family="Nunito Sans" font-size="12" fill="#888">© PodSquad — a safe studio for young voices</text>
</svg>
