<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700">
  <rect width="100%" height="100%" fill="#F7FAFF"/>
  <text x="40" y="60" font-family="Nunito Sans" font-size="20" fill="#0B1220">Episode Library</text>

  <rect x="40" y="90" width="920" height="520" rx="12" fill="#fff" stroke="#eee"/>

  <!-- Filters -->
  <rect x="60" y="120" width="180" height="36" rx="8" fill="#fff" stroke="#ddd"/>
  <text x="70" y="145" font-family="Nunito Sans" font-size="12" fill="#666">Filter: Draft / Published / Classwork</text>

  <!-- Episode tiles grid -->
  <g>
    <rect x="60" y="170" width="260" height="120" rx="12" fill="#FDF6F5" stroke="#FFEAE8"/>
    <text x="90" y="200" font-family="Nunito Sans" font-size="14" fill="#0B1220">Puppy Adventure</text>
    <text x="90" y="220" font-family="Nunito Sans" font-size="12" fill="#666">Zoie • 2 min</text>

    <rect x="360" y="170" width="260" height="120" rx="12" fill="#FFF9EC" stroke="#FFF0C2"/>
    <rect x="660" y="170" width="260" height="120" rx="12" fill="#F0F7FF" stroke="#DCEEFF"/>
  </g>

  <!-- Selected episode detail -->
  <rect x="340" y="310" width="620" height="260" rx="12" fill="#fff" stroke="#eee"/>
  <text x="360" y="340" font-family="Nunito Sans" font-size="16" fill="#0B1220">Puppy Adventure — Transcript</text>
  <rect x="360" y="360" width="580" height="160" rx="8" fill="#FAFAFA" stroke="#f0f0f0"/>

  <text x="60" y="640" font-family="Nunito Sans" font-size="12" fill="#888">Share: Copy Link • Export MP3 • Edit</text>
</svg>
