name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run unit tests
        run: npm test

      - name: Start production server (background)
        run: |
          npm run build
          npm run start &
          echo $! > .pid

      - name: Wait for server
        run: |
          for i in {1..60}; do
            if curl -sS http://localhost:3001/ >/dev/null 2>&1; then
              echo "server ready"; break;
            fi
            sleep 2
          done

      - name: Smoke test root
        run: npm run smoke:root

      - name: Smoke test reply
        run: npm run smoke:reply

      - name: Playwright E2E
        run: |
          npx playwright install --with-deps
          npx playwright test --reporter=list,html

      - name: Upload Playwright report (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report

      - name: Stop dev server
        if: always()
        run: |
          if [ -f .pid ]; then
            kill $(cat .pid) || true
          fi
